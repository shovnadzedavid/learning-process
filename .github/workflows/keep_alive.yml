name: Keep Streamlit Alive

on:
  schedule:
    # ეშვება ავტომატურად ყოველ 6 საათში ერთხელ
    - cron: '0 */6 * * *'
  workflow_dispatch: # ხელით გაშვების ღილაკი

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit URL
        run: |
          curl -s -I "https://learningapp-official.streamlit.app" | head -n 1
